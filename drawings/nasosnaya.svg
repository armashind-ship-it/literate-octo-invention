<text x="150.0" y="3910.0" font-family="Arial" font-size="24" text-anchor="start" font-weight="normal" fill="#666">Примечания: 1) Расшифровка эскиза выполнена вручную, часть цифр неразборчива (A5: «4300 раз.?», высота 1200).</text>
<text x="150.0" y="3950.0" font-family="Arial" font-size="24" text-anchor="start" font-weight="normal" fill="#666">2) 4300 — длина ската/стропила на A5, уточнить. 3) «10,75 м³» и «31,24 м²» — не проверены, в спецификацию не включены.</text>
<text x="150.0" y="3990.0" font-family="Arial" font-size="24" text-anchor="start" font-weight="normal" fill="#666">3) Сумма 138 м/п и 79 м/п совпадает с итогами на эскизе — это подтверждает прочтение труб.</text></svg>